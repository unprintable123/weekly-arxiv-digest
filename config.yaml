# Weekly arXiv digest example configuration.
# Classification topics live in TOPICS.yaml; this file only controls crawling,
# the time window, output locations, and the LLM classification connection.
# Provider credentials are read from environment variables, never from YAML.

source:
  # Source provider: papers.cool (HTML) or arxiv (Export API)
  provider: "papers.cool"
  base_url: "https://papers.cool"
  arxiv_base_url: "https://export.arxiv.org"
  # arXiv categories to crawl. Natural-language arXiv subject names
  # ("Machine Learning") are also accepted and mapped to their IDs.
  categories: ["cs.LG", "cs.CL", "cs.AI"]
  request_delay_ms: 400
  timeout_ms: 20000
  user_agent: "weekly-digest/0.1"
  concurrency: 5

window:
  timezone: "UTC"
  # last-complete-week | current-week
  default: "last-complete-week"

output:
  directory: "digests"
  # Each week's Markdown files are written into a "YYYY-Www" subfolder.
  subdirectory: "{week}"
  # One Markdown file per week and per classification category.
  filename: "weekly-{week}-{category}.md"

llm:
  # Classification worker: an OpenAI-compatible chat completion endpoint.
  # The endpoint and API key come from BASE_URL / API_KEY in the environment
  # (.env is loaded automatically); base_url here overrides the env endpoint.
  # Classification uses a fixed, versioned prompt with the controlled
  # TOPICS.yaml vocabulary only.
  model: "GLM-5.3-Flash"
  timeout_ms: 120000
  max_retries: 2
