<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekly arXiv Digest</title>
    <meta name="description" content="Weekly arXiv paper digest by category" />
    <link rel="stylesheet" href="./assets/app.css" />
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body
    class="min-h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
  >
    <header
      class="sticky top-0 z-20 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80"
    >
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-3">
        <h1 class="mr-auto text-lg font-bold tracking-tight">
          <span class="text-indigo-600 dark:text-indigo-400">Weekly</span> arXiv Digest
        </h1>

        <label class="flex items-center gap-2 text-sm">
          <span class="text-slate-500 dark:text-slate-400">Week</span>
          <select
            id="week-select"
            class="rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-900"
          ></select>
        </label>

        <label class="flex items-center gap-2 text-sm">
          <span class="text-slate-500 dark:text-slate-400">Group</span>
          <select
            id="group-select"
            title=""
            class="w-32 rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-900"
          ></select>
        </label>

        <label class="flex items-center gap-2 text-sm">
          <span class="text-slate-500 dark:text-slate-400">Category</span>
          <select
            id="category-select"
            title=""
            class="w-32 rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-900"
          ></select>
        </label>

        <span
          id="count-badge"
          class="hidden rounded-full bg-indigo-100 px-2.5 py-1 text-xs font-semibold text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300"
        ></span>

        <input
          id="search-input"
          type="search"
          placeholder="Filter title / author / abstract…"
          class="w-48 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-900"
        />

        <button
          id="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          class="rounded-lg border border-slate-300 p-2 text-slate-500 shadow-sm hover:bg-slate-100 dark:border-slate-700 dark:text-slate-400 dark:hover:bg-slate-800"
        >
          <svg id="icon-sun" class="hidden h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M10 3a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1Zm0 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7-3a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1ZM5 10a1 1 0 0 1-1 1H3a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1Zm10.657-5.657a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0ZM6.464 13.536a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0Zm9.193 2.121a1 1 0 0 1-1.414 0l-.707-.707a1 1 0 0 1 1.414-1.414l.707.707a1 1 0 0 1 0 1.414ZM6.464 6.464A1 1 0 0 1 5.05 5.05l.707-.707a1 1 0 0 1 1.414 1.414l-.707.707Z"
            />
          </svg>
          <svg id="icon-moon" class="hidden h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path d="M17.293 13.293A8 8 0 0 1 6.707 2.707a8.001 8.001 0 1 0 10.586 10.586Z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6">
      <div
        class="mb-5 flex items-center justify-between gap-3 text-xs text-slate-500 dark:text-slate-400"
      >
        <div id="meta-line" class="min-w-0 flex-1 truncate"></div>
        <div class="flex shrink-0 gap-1.5">
          <button
            id="week-prev"
            type="button"
            title="Previous week"
            aria-label="Previous week"
            disabled
            class="rounded-lg border p-1.5 shadow-sm disabled:cursor-not-allowed disabled:opacity-40 enabled:hover:bg-slate-100 dark:enabled:hover:bg-slate-800"
          >
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M12.78 4.22a.75.75 0 0 1 0 1.06L8.06 10l4.72 4.72a.75.75 0 1 1-1.06 1.06L6.44 10.53a.75.75 0 0 1 0-1.06l5.28-5.25a.75.75 0 0 1 1.06 0Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
          <button
            id="week-next"
            type="button"
            title="Next week"
            aria-label="Next week"
            disabled
            class="rounded-lg border p-1.5 shadow-sm disabled:cursor-not-allowed disabled:opacity-40 enabled:hover:bg-slate-100 dark:enabled:hover:bg-slate-800"
          >
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M7.24 4.22a.75.75 0 0 0 0 1.06L11.96 10l-4.72 4.72a.75.75 0 1 0 1.06 1.06l5.28-5.25a.75.75 0 0 0 0-1.06L8.38 4.22a.75.75 0 0 0-1.14 0Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>

      <div id="paper-list" class="grid grid-cols-1 gap-4 lg:grid-cols-2"></div>

      <div
        id="state-empty"
        class="hidden rounded-2xl border border-dashed border-slate-300 p-12 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400"
      ></div>
      <div
        id="state-error"
        class="hidden rounded-2xl border border-red-200 bg-red-50 p-8 text-center text-sm text-red-700 dark:border-red-900 dark:bg-red-950/40 dark:text-red-300"
      ></div>

      <footer
        class="mt-10 border-t border-slate-200 pt-4 text-xs text-slate-400 dark:border-slate-800 dark:text-slate-500"
      >
        <div>
          Links are restricted to arxiv.org and papers.cool; metadata comes from the configured
          provider.
        </div>
        <div id="footer-meta" class="mt-1 font-mono"></div>
      </footer>
    </main>

    <noscript>
      <div class="mx-auto max-w-6xl px-4 pb-8 text-sm text-amber-700">
        This site requires JavaScript to load digest data.
      </div>
    </noscript>
  </body>
</html>
